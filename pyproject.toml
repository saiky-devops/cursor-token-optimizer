[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cursor-token-optimize"
version = "0.1.0"
description = "Analyze Cursor agent sessions and suggest rules to reduce token waste"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cursor Token Optimize Contributors" }]
keywords = ["cursor", "tokens", "ai", "optimization", "context"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
cursor-token-optimize = "cursor_token_optimize.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cursor_token_optimize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
